<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <style>
        body{
            font-family: Arial;
        }
        .todo-grid,
        .todo-input-grid{
            display: grid;
            grid-template-columns: 200px 150px 100px;
            column-gap: 10px;
            row-gap: 10px;
            align-items: center;
        }

        .todo-input-grid{
            margin-bottom: 10px;
            align-items: stretch;
        }

        .name-input,
        .due-date-input{
            font-size: 15px;
            padding: 6px;
        }
        .add-btn{
            color:white;
            background-color: green;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }
        .delete-btn{
            background-color: darkred;
            color: white;
            font-size: 15px;
            border: none;
            cursor: pointer;
            padding: 10px 5px  ;
        }
    </style>
</head>
<body>
    <p>Todo List</p>
    <div class="todo-input-grid">
        <input placeholder="Todo Name"
    class="js-name-input name-input">
    <input type="date"
     class="js-due-date-input due-date-input">
    <button class="add-btn js-add-todo-button">Add</button>
    </div>
    
    <div class="js-todo-list todo-grid">

    </div>
    <script src="js-todo.js">
           
    </script>
</body>
</html>
